<section class="page-container">
  <header class="page-header">
    <div>
      <h1>Proveedores</h1>
      <p class="subtitle">
        Gestión de proveedores, condiciones comerciales y productos asociados por unidad de compra.
      </p>
    </div>

    @if (canManageSuppliers()) {
      <button mat-flat-button type="button" (click)="openCreate()">
        <mat-icon aria-hidden="true">add</mat-icon>
        Nuevo proveedor
      </button>
    }
  </header>

  <form class="filter-bar" [formGroup]="filterForm" (ngSubmit)="applyFilters()">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Buscar por RUT o nombre</mat-label>
      <input
        matInput
        formControlName="q"
        placeholder="76.123.456-K, razón social o nombre de fantasía"
      />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Estado</mat-label>
      <mat-select formControlName="active">
        <mat-option [value]="null">Todos</mat-option>
        <mat-option [value]="true">Activos</mat-option>
        <mat-option [value]="false">Inactivos</mat-option>
      </mat-select>
    </mat-form-field>

    <button mat-stroked-button type="submit">Filtrar</button>
    <button mat-button type="button" (click)="clearFilters()">Limpiar</button>
  </form>

  <pos-paginated-table
    [dataSource]="dataSource"
    [columns]="columns()"
    label="Listado de proveedores"
    emptyMessage="No se encontraron proveedores con los filtros aplicados."
  />

  <ng-template #statusTpl let-row>
    <span class="status-badge" [class.active]="row.active" [class.inactive]="!row.active">
      {{ row.active ? 'Activo' : 'Inactivo' }}
    </span>
  </ng-template>

  <ng-template #actionsTpl let-row>
    <div class="row-actions">
      <button mat-button type="button" (click)="openProducts(row)">
        <mat-icon aria-hidden="true">inventory_2</mat-icon>
        Productos
      </button>
      @if (canManageSuppliers()) {
        <button
          mat-icon-button
          type="button"
          [matMenuTriggerFor]="supplierMenu"
          aria-label="Más acciones del proveedor"
        >
          <mat-icon aria-hidden="true">more_vert</mat-icon>
        </button>
        <mat-menu #supplierMenu="matMenu">
          <button mat-menu-item type="button" (click)="openEdit(row)">
            <mat-icon aria-hidden="true">edit</mat-icon>
            <span>Editar</span>
          </button>
          <button mat-menu-item type="button" (click)="toggleActive(row)">
            <mat-icon aria-hidden="true">{{ row.active ? 'block' : 'check_circle' }}</mat-icon>
            <span>{{ row.active ? 'Desactivar' : 'Activar' }}</span>
          </button>
        </mat-menu>
      }
    </div>
  </ng-template>
</section>
