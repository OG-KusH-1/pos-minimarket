# nginx del servicio `web`: sirve el build de Angular y hace proxy de /api.
# El endurecimiento (CSP, HSTS, etc.) se agrega en T95.
server {
    # 8080: la imagen nginx-unprivileged no puede enlazar puertos < 1024.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras basicas. Se repiten en cada location que declara add_header,
    # porque nginx no hereda add_header cuando el bloque hijo define alguno.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API: se conserva el prefijo /api (el backend sirve bajo /api).
    # `resolver` + variable evita que nginx falle al arrancar si `api` aun no resuelve.
    # `^~` evita que la regex de assets capture rutas como /api/v1/files/1.png.
    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # unico proxy: no se confia en XFF del cliente
        proxy_set_header X-Forwarded-Proto $scheme;
        # Importaciones y archivos de hasta 20 MB (FILE_INVALID) con margen.
        client_max_body_size 25m;
        proxy_read_timeout 60s;
    }

    # Assets con hash en el nombre: cache larga.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA: toda ruta desconocida vuelve a index.html (router de Angular).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
