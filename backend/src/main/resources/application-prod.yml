# Perfil prod: sin defaults. Toda credencial es obligatoria por variable de entorno
# (POS_DB_*, POS_FLYWAY_*, POS_JWT_SECRET, POS_ADMIN_PASSWORD_HASH, POS_CORS_ALLOWED_ORIGINS);
# si falta alguna, el arranque falla en lugar de usar un valor inseguro.
# El logging en JSON (logstash) se activa en logback-spring.xml para este perfil.

spring:
  flyway:
    # Nunca out-of-order ni db/demo en producción.
    out-of-order: false
    locations: classpath:db/migration
  jpa:
    show-sql: false

springdoc:
  # Swagger y la especificación OpenAPI no se exponen en producción.
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  # Detrás de nginx: respeta X-Forwarded-* para IP de cliente (rate limiting) y esquema.
  forward-headers-strategy: framework

logging:
  level:
    root: WARN
    cl.minimarket.pos: INFO
